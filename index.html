  <script>

  <style>

      --ink: #f8fafc;

      --panel: rgba(255, 255, 255, 0.04);

      --mark: #fbbf24;
      --mark-ink: #1c1408;

      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Cairo", Tahoma, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 100% -10%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 55%),
        radial-gradient(700px 380px at 0% 110%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 50%),
        var(--bg);
      overflow: hidden;
    }
    .key-infra {
      font-weight: 800;
      text-decoration-line: underline;
      text-decoration-thickness: 3px;
      text-decoration-color: var(--line);
      text-underline-offset: 0.16em;
      text-decoration-skip-ink: none;
    }
    .key-data {
      font-weight: 800;
      line-height: 1.45;
      color: var(--mark-ink);
      background: var(--mark);
      border-radius: 0.2em;
      padding: 0 0.14em;
      white-space: nowrap;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .story-copy {
      line-height: 2.2 !important;
    }
    .slide-forward { animation: slideForward 0.42s ease; }
    .slide-back { animation: slideBack 0.42s ease; }
    @keyframes slideForward {
      from { opacity: 0; transform: translateX(28px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes slideBack {
      from { opacity: 0; transform: translateX(-28px); }
      to { opacity: 1; transform: none; }

    .logo-plate {

    .logo-plate.wide { width: 11.5rem; }
    .logo-plate.square { width: 4.6rem; padding: 0.4rem; }
    .logo-plate img { max-width: 100%; max-height: 3.5rem; object-fit: contain; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--card-border);
      border-inline-start-width: 4px;
      border-radius: 1rem;
    }
    .panel-infra { border-inline-start-color: var(--line); }
    .panel-data { border-inline-start-color: var(--mark-edge); }

    button:focus-visible, .dot:focus-visible {

    }
    @media (prefers-reduced-motion: reduce) {
      .slide-forward, .slide-back, .hook .key-data { animation: none; }
    }
    @media (max-width: 720px) {

</head>

        infra: "يستند المكتب إلى [[حاسوب فائق ومحطات رصد ورادارات ونماذج عددية]] تغذّي الزراعة والسياحة والطيران. [[القدرة الحاسوبية كانت كبيرة]].",

    var index = 0;
    var direction = "forward";
    var stage = document.getElementById("stage");
    var dots = document.getElementById("dots");
    var counter = document.getElementById("counter");
    var prevBtn = document.getElementById("prevBtn");
    var nextBtn = document.getElementById("nextBtn");
    var themeBtn = document.getElementById("themeBtn");
    var shortNames = ["سوني", "ناسا", "ناتويست", "أمازون", "كوانتس", "الأرصاد", "تارجت"];

    function mark(text) {
      return text
        .split("[[").join('<span class="key-infra">')
        .split("]]").join("</span>")
        .split("{{").join('<span class="key-data">')
        .split("}}").join("</span>");
    }

    function readHash() {
      var n = parseInt(String(location.hash || "").replace("#", ""), 10);
      if (n >= 1 && n <= stories.length) index = n - 1;
    }

    function renderDots() {
      dots.innerHTML = stories.map(function (story, i) {
        var active = i === index;
        return '<button type="button" class="dot min-h-10 rounded-full px-2.5 py-1 text-xs font-bold md:text-sm ' +
          (active
            ? "bg-slate-900 text-white dark:bg-amber-400 dark:text-slate-950"
            : "bg-slate-200/80 text-slate-700 dark:bg-white/10 dark:text-slate-200") +
          '" role="tab" aria-selected="' + active + '" aria-label="القصة ' + (i + 1) + ": " + shortNames[i] + '">' +
          (i + 1) + '<span class="ms-1 hidden sm:inline">' + shortNames[i] + "</span></button>";
      }).join("");
      Array.prototype.forEach.call(dots.querySelectorAll("button"), function (btn, i) {
        btn.addEventListener("click", function () {
          if (i === index) return;
          direction = i > index ? "forward" : "back";
          index = i;
          render();
        });
      });
    }

    function render() {
      var story = stories[index];
      document.documentElement.style.setProperty("--accent", story.accent);
      counter.textContent = (index + 1) + " / " + stories.length;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === stories.length - 1;
      stage.innerHTML =
        '<article class="' + (direction === "back" ? "slide-back" : "slide-forward") + ' my-auto flex w-full flex-col gap-2 rounded-[1.6rem] border p-3 shadow-[var(--shadow)] md:p-4" style="background:var(--card);border-color:var(--card-border);border-inline-start:6px solid ' + story.accent + '">' +
          '<header class="flex flex-wrap items-center gap-4">' +
            '<div class="logo-plate ' + story.fit + '"><img src="' + story.logo + '" alt="' + story.logoAlt + '"></div>' +
            '<div class="min-w-0 flex-1">' +
              '<p class="text-sm font-bold" style="color:' + story.accent + '">' + story.latin + " · " + story.meta + "</p>" +
              '<h2 class="text-2xl font-black leading-tight md:text-4xl">' + story.company + "</h2>" +
              '<p class="mt-1 text-base font-semibold text-[var(--muted)] md:text-xl">' + story.event + "</p>" +
            "</div>" +
          "</header>" +
          '<p class="hook story-copy rounded-2xl px-4 py-3 text-lg font-bold md:text-2xl" style="background:color-mix(in srgb, var(--accent) 12%, transparent)">' + mark(story.hook) + "</p>" +
          '<div class="grid gap-3 lg:grid-cols-3">' +
            '<section class="panel panel-infra p-3 md:p-4">' +
              '<h3 class="mb-1 text-sm font-black text-sky-800 dark:text-sky-300">حالة البنية التحتية</h3>' +
              '<p class="story-copy text-base text-[var(--ink)] md:text-lg">' + mark(story.infra) + "</p>" +
            "</section>" +
            '<section class="panel panel-data p-3 md:p-4">' +
              '<h3 class="mb-1 text-sm font-black" style="color:var(--mark-edge)">الخلل في البيانات</h3>' +
              '<p class="story-copy text-base text-[var(--ink)] md:text-lg">' + mark(story.flaw) + "</p>" +
            "</section>" +
            '<section class="panel panel-impact p-3 md:p-4">' +
              '<h3 class="mb-1 text-sm font-black text-rose-700 dark:text-rose-300">النتائج والأضرار</h3>' +
              '<p class="story-copy text-base text-[var(--ink)] md:text-lg">' + mark(story.impact) + "</p>" +
            "</section>" +
          "</div>" +
          '<aside class="rounded-2xl px-4 py-3" style="background:var(--lesson);box-shadow:inset 0 0 0 2px var(--lesson-edge)">' +
            '<p class="story-copy text-base font-bold md:text-xl"><span class="me-1 inline-block rounded-lg px-2 py-0.5 align-middle text-sm font-black" style="background:var(--mark);color:var(--mark-ink)">العبرة:</span> ' + mark(story.lesson) + "</p>" +
          "</aside>" +
        "</article>";
      renderDots();
      if (location.hash !== "#" + (index + 1)) {
        history.replaceState(null, "", "#" + (index + 1));
      }
    }

    function go(step) {
      var next = index + step;
      if (next < 0 || next >= stories.length) return;
      direction = step > 0 ? "forward" : "back";
      index = next;
      render();
    }

    function syncThemeButton() {
      var dark = document.documentElement.classList.contains("dark");
      themeBtn.textContent = dark ? "الوضع الفاتح" : "الوضع الداكن";
      themeBtn.setAttribute("aria-label", dark ? "التبديل إلى الوضع الفاتح" : "التبديل إلى الوضع الداكن");
    }

    prevBtn.addEventListener("click", function () { go(-1); });
    nextBtn.addEventListener("click", function () { go(1); });
    themeBtn.addEventListener("click", function () {
      document.documentElement.classList.toggle("dark");
      localStorage.setItem("disasters-theme", document.documentElement.classList.contains("dark") ? "dark" : "light");
      syncThemeButton();
    });
    document.addEventListener("keydown", function (event) {
      var tag = (event.target && event.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (event.key === "ArrowRight" || event.key === "ArrowDown" || event.key === "PageDown" || event.key === " ") {
        event.preventDefault();
        go(1);
      } else if (event.key === "ArrowLeft" || event.key === "ArrowUp" || event.key === "PageUp" || event.key === "Backspace") {
        event.preventDefault();
        go(-1);
      } else if (event.key === "Home") {
        direction = "back";
        index = 0;
        render();
      } else if (event.key === "End") {
        direction = "forward";
        index = stories.length - 1;
        render();
      }
    });

    var touchX = 0;
    stage.addEventListener("touchstart", function (event) {
      touchX = event.changedTouches[0].clientX;
    }, { passive: true });
    stage.addEventListener("touchend", function (event) {
      var delta = event.changedTouches[0].clientX - touchX;
      if (Math.abs(delta) < 50) return;
      go(delta < 0 ? -1 : 1);
    }, { passive: true });

    window.addEventListener("hashchange", function () {
      var previous = index;
      readHash();
      direction = index >= previous ? "forward" : "back";
      render();
    });

    readHash();
    syncThemeButton();
    render();
  </script>
</body>
</html>
